name: Deploy

# Branch → environment mapping:
#   push to `staging` → deploys to stage.emxautodiagnosisandrepair.com
#   push to `master`  → deploys to www.emxautodiagnosisandrepair.com (production)
#
# Promotion flow: feature/* → PR into `staging` (auto-deploys stage) →
#                 review on stage → PR `staging` → `master` (deploys prod).
on:
  push:
    branches: [staging, master]
  workflow_dispatch: {}   # allows a manual re-deploy from the Actions tab

# Never let two deploys to the same branch overlap.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # GitHub Environment. Add a "Required reviewer" to the `production`
    # environment in repo Settings → Environments to turn merges-to-master
    # into a manual-approval gate. Until then it deploys automatically.
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}

    env:
      IS_PROD: ${{ github.ref == 'refs/heads/master' }}
      DEPLOY_PATH: ${{ github.ref == 'refs/heads/master' && '/home/u302575614/domains/emxautodiagnosisandrepair.com/public_html' || '/home/u302575614/domains/emxautodiagnosisandrepair.com/public_html/stage.emxautodiagnosisandrepair.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # One SSH config alias shared by rsync + ssh. accept-new avoids a
          # separate ssh-keyscan call, which can time out from a GitHub runner
          # and fail the whole deploy (the host is trusted on first connect).
          cat > ~/.ssh/config <<'CFG'
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
          CFG
          chmod 600 ~/.ssh/config

      - name: Show deploy target
        run: |
          echo "Branch     : ${{ github.ref_name }}"
          echo "Production : ${{ env.IS_PROD }}"
          echo "Target path: ${{ env.DEPLOY_PATH }}"

      - name: Upload code (rsync over SSH)
        run: |
          rc=1
          for attempt in 1 2 3; do
            set +e
            rsync -rlptDvz --delete --omit-dir-times \
              -e "ssh -F $HOME/.ssh/config" \
              --exclude-from=.deploy/rsync-exclude.txt \
              ./ "deploy:${{ env.DEPLOY_PATH }}/"
            rc=$?
            set -e
            # 0 = OK. 23/24 = harmless partial-attr warnings on shared hosting.
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 23 ] || [ "$rc" -eq 24 ]; then break; fi
            echo "::warning::rsync attempt $attempt failed (exit $rc); retrying in 20s..."
            sleep 20
          done
          echo "rsync final exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 23 ] && [ "$rc" -ne 24 ]; then
            echo "::error::rsync failed after 3 attempts (exit $rc)"
            exit "$rc"
          fi

      - name: Post-deploy (composer + artisan)
        run: |
          ok=0
          for attempt in 1 2 3; do
            if ssh -F "$HOME/.ssh/config" deploy \
                 IS_PROD="${{ env.IS_PROD }}" DEPLOY_PATH="${{ env.DEPLOY_PATH }}" \
                 'bash -s' < .deploy/remote-deploy.sh; then
              ok=1; break
            fi
            echo "::warning::post-deploy attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::post-deploy failed after 3 attempts"
            exit 1
          fi
